services:
  - type: web
    name: freight-forwarding-phase1-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    preDeployCommand: python -m alembic upgrade head
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
        - render.yaml
        - .python-version
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: AUTO_CREATE_TABLES
        value: false
      - key: BACKEND_CORS_ORIGINS
        value: https://freight-forwarding-phase1.onrender.com
      - key: FRONTEND_BASE_URL
        value: https://freight-forwarding-phase1.onrender.com
      - key: AI_ENABLED
        value: false
      - key: GMAIL_ENABLED
        value: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: DOCUMENT_STORAGE_BACKEND
        value: database
      - key: ADMIN_NAME
        value: Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: freight-forwarding-phase1
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
        - .node-version
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://freight-forwarding-phase1-api.onrender.com/api
